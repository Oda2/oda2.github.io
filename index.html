<!DOCTYPE html>
<html lang="pt-BR" data-lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Renato Oda | Tech Lead</title>
  <meta name="description" content="Tech Lead specializing in distributed systems, observability, and platform engineering.">
  <link rel="stylesheet" href="style.css?v=3">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
  <div class="bg-grid"></div>

  <header class="header">
    <div class="header-left">
      <div class="avatar">
        <img id="avatar-img" src="" alt="Profile" />
        <div class="status-dot"></div>
      </div>
      <div class="header-info">
        <h1>Renato Oda</h1>
        <p class="subtitle"></p>
        <div class="tags" id="header-tags"></div>
      </div>
    </div>

    <nav class="nav">
      <a href="#about" data-i18n="navAbout">About</a>
      <a href="#experience" data-i18n="navExperience">Experience</a>
      <div class="nav-divider"></div>
      <button id="terminal-btn" class="nav-icon" title="Terminal">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4,17 10,11 4,5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
      </button>
      <a href="https://github.com/oda2" target="_blank" class="nav-icon" title="GitHub">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
      </a>
      <a href="https://www.linkedin.com/in/renatooda/" target="_blank" class="nav-icon" title="LinkedIn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
      </a>
      <a href="mailto:renato.oda2@gmail.com" class="nav-icon" title="Email">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
      </a>
      <select id="lang" class="lang-select" aria-label="Language">
        <option value="pt">PT-BR</option>
        <option value="en">EN</option>
        <option value="es">ES</option>
      </select>
    </nav>
  </header>

  <main class="main-grid">
    <section id="about" class="card about-card">
      <div class="card-header">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
        <span data-i18n="about">About</span>
      </div>
      <p id="about-text" class="about-text"></p>
      <p id="about-full" class="about-full"></p>
      
      <div class="about-section">
        <p class="section-subtitle" data-i18n="whereImpactTitle"></p>
        <ul id="where-impact-list" class="impact-list"></ul>
      </div>
      
      <div class="about-section">
        <p class="section-subtitle" data-i18n="leadershipTitle"></p>
        <ul id="leadership-list" class="impact-list"></ul>
      </div>
      
      <div class="about-section">
        <p class="section-subtitle" data-i18n="backgroundTitle"></p>
        <p id="background-text" class="background-text"></p>
      </div>
    </section>

    <section id="experience" class="card experience-card">
      <div class="card-header">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <div class="card-tabs" id="card-tabs" role="tablist">
          <button class="card-tab active" id="tab-experience" role="tab" aria-selected="true" aria-controls="panel-experience" data-tab="experience" data-i18n="experience">Experience</button>
          <button class="card-tab" id="tab-education" role="tab" aria-selected="false" aria-controls="panel-education" data-tab="education" data-i18n="educationTitle">Education</button>
          <button class="card-tab" id="tab-certifications" role="tab" aria-selected="false" aria-controls="panel-certifications" data-tab="certifications" data-i18n="certificationsTitle">Certifications</button>
        </div>
        <span class="card-header-meta" id="card-meta"></span>
      </div>

      <div class="tab-panel active" id="panel-experience" role="tabpanel" aria-labelledby="tab-experience">
        <div class="timeline" id="timeline"></div>
      </div>

      <div class="tab-panel" id="panel-education" role="tabpanel" aria-labelledby="tab-education" hidden>
        <ul class="education-list" id="education-list"></ul>
      </div>

      <div class="tab-panel" id="panel-certifications" role="tabpanel" aria-labelledby="tab-certifications" hidden>
        <ul class="certifications-list" id="certifications-list"></ul>
        <p class="cert-note" id="cert-note"></p>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="footer-content"></div>
    <p>© <span id="year">2024</span> Renato Oda</p>
  </footer>

  <div id="exp-modal" class="terminal-modal">
    <div class="terminal-overlay"></div>
    <div class="terminal-panel exp-panel">
      <div class="terminal-header">
        <div class="terminal-title">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14,2 14,8 20,8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10,9 9,9 8,9"/></svg>
          <span data-i18n="expDetailsTitle">Experience Details</span>
        </div>
        <button id="exp-close" class="terminal-close">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div id="exp-content" class="exp-content"></div>
    </div>
  </div>

  <div id="terminal-modal" class="terminal-modal">
    <div class="terminal-overlay"></div>
    <div class="terminal-panel">
      <div class="terminal-header">
        <div class="terminal-title">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4,17 10,11 4,5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
          <span data-i18n="terminalTitle">Terminal</span>
        </div>
        <button id="terminal-close" class="terminal-close">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div id="terminal-output" class="terminal-output"></div>
      <div class="terminal-input-wrapper">
        <span class="terminal-prompt">$</span>
        <input id="terminal-input" type="text" autocomplete="off" spellcheck="false" placeholder="help" aria-label="Terminal input">
      </div>
    </div>
  </div>

  <script src="i18n.js?v=3"></script>
  <script src="main.js?v=3"></script>
</body>
</html>
